name: Build Mavis APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Flutter project
        run: flutter create --platforms=android --org com.emzaro.mavis --project-name mavis /tmp/mavis

      - name: Install Mavis source
        run: |
          cp pubspec.yaml /tmp/mavis/pubspec.yaml
          rm -rf /tmp/mavis/lib
          cp -r lib /tmp/mavis/lib

      - name: Resolve dependencies
        working-directory: /tmp/mavis
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: /tmp/mavis
        run: flutter analyze --no-pub

      - name: Build debug APK
        working-directory: /tmp/mavis
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mavis-debug-apk
          path: /tmp/mavis/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
