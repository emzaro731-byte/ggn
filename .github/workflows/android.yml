name: Build Mavis APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'server.js'
      - 'package.json'
      - 'render.yaml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Flutter project
        run: flutter create --platforms=android --org com.emzaro.mavis --project-name mavis /tmp/mavis

      - name: Install Mavis source
        run: |
          cp pubspec.yaml /tmp/mavis/pubspec.yaml
          rm -rf /tmp/mavis/lib
          cp -r lib /tmp/mavis/lib
          rm -f /tmp/mavis/test/widget_test.dart

      - name: Add required Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/mavis/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          i = s.find('>', s.find('<manifest')) + 1
          additions = []
          for name in ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO']:
              if name not in s:
                  additions.append(f'    <uses-permission android:name="{name}"/>')
          if additions:
              s = s[:i] + '\n' + '\n'.join(additions) + '\n' + s[i:]
          p.write_text(s)
          PY

      - name: Add floating M overlay service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/mavis/android/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          s = manifest.read_text()
          if 'android.permission.SYSTEM_ALERT_WINDOW' not in s:
              i = s.find('>', s.find('<manifest')) + 1
              s = s[:i] + '\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>' + s[i:]
          if 'MavisFloatingService' not in s:
              s = s.replace('<application', '<application')
              s = s.replace('</application>', '    <service android:name=".MavisFloatingService" android:exported="false" />\n    </application>')
          manifest.write_text(s)
          main = next(root.glob('**/MainActivity.kt'))
          source = main.read_text()
          package = re.search(r'package\s+([\w.]+)', source).group(1)
          if 'com.emzaro.mavis/overlay' not in source:
              source = source.replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\nimport io.flutter.plugin.common.MethodChannel\nimport android.content.Intent\nimport android.net.Uri\nimport android.provider.Settings')
              source = source.replace('class MainActivity : FlutterActivity()', '''class MainActivity : FlutterActivity() {
                override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.emzaro.mavis/overlay").setMethodCallHandler { call, result ->
                    if (call.method == "enable") {
                      if (!Settings.canDrawOverlays(this)) {
                        val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))
                        startActivity(intent)
                        result.success("Allow Mavis to display over other apps. The floating M will start automatically when you return.")
                      } else {
                        startService(Intent(this, MavisFloatingService::class.java))
                        result.success("Floating M is enabled across your apps.")
                      }
                    } else result.notImplemented()
                  }
                }
                override fun onResume() {
                  super.onResume()
                  // Keep startup stable: do not launch an overlay service automatically.
                  // Enable the floating M only when the user explicitly taps its control.
                  // After granting overlay permission, return to Mavis and tap enable again.
                }
              }''')
              main.write_text(source)
          service = root / main.parent.relative_to(root) / 'MavisFloatingService.java'
          service.write_text('''package PACKAGE_NAME;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.View;
          import android.widget.TextView;
          public class MavisFloatingService extends Service {
            private WindowManager wm; private View bubble;
            public void onCreate() {
              super.onCreate(); wm=(WindowManager)getSystemService(WINDOW_SERVICE);
              TextView b=new TextView(this); b.setText("M"); b.setTextColor(Color.WHITE); b.setTextSize(26); b.setTypeface(null,Typeface.BOLD); b.setGravity(Gravity.CENTER);
              GradientDrawable d=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{0xff65c9ff,0xff0751d4}); d.setShape(GradientDrawable.OVAL); d.setStroke(2,0xffd9f5ff); b.setBackground(d);
              WindowManager.LayoutParams p=new WindowManager.LayoutParams(62,62,WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT);
              p.gravity=Gravity.TOP|Gravity.END; p.x=18; p.y=260;
              b.setOnTouchListener(new View.OnTouchListener(){float x,y; int sx,sy; public boolean onTouch(View v, android.view.MotionEvent e){ if(e.getAction()==0){x=e.getRawX();y=e.getRawY();sx=p.x;sy=p.y;return true;} if(e.getAction()==2){p.x=sx+(int)(x-e.getRawX());p.y=sy+(int)(e.getRawY()-y);wm.updateViewLayout(b,p);return true;} if(e.getAction()==1){ if(Math.abs(e.getRawX()-x)<12&&Math.abs(e.getRawY()-y)<12){Intent i=getPackageManager().getLaunchIntentForPackage(getPackageName()); if(i!=null){i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_SINGLE_TOP);startActivity(i);} } return true;} return true;}});
              try { wm.addView(b,p); bubble=b; }
            catch (RuntimeException e) {
              android.util.Log.e("Mavis", "Overlay view unavailable; keeping app alive", e);
              bubble=null;
              stopSelf();
            }
            }
            public int onStartCommand(Intent i,int f,int id){return START_STICKY;}
            public void onDestroy(){if(wm!=null&&bubble!=null)wm.removeView(bubble);super.onDestroy();}
            public IBinder onBind(Intent i){return null;}
          }
          '''.replace('PACKAGE_NAME',package))
          PY

      - name: Add selectable Mavis default assistant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/mavis/android/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          s = manifest.read_text()
          main = next(root.glob('**/MainActivity.kt'))
          package = re.search(r'package\\s+([\\w.]+)', main.read_text()).group(1)
          java_dir = main.parent
          (java_dir / 'MavisVoiceInteractionService.java').write_text('''package PACKAGE_NAME;
          public class MavisVoiceInteractionService extends android.service.voice.VoiceInteractionService {}
          '''.replace('PACKAGE_NAME', package))
          (java_dir / 'MavisVoiceSessionService.java').write_text('''package PACKAGE_NAME;
          public class MavisVoiceSessionService extends android.service.voice.VoiceInteractionSessionService {
            @Override
            public android.service.voice.VoiceInteractionSession onNewSession(android.os.Bundle args) {
              return new MavisVoiceSession(this);
            }
          }
          '''.replace('PACKAGE_NAME', package))
          (java_dir / 'MavisVoiceSession.java').write_text('''package PACKAGE_NAME;
          public class MavisVoiceSession extends android.service.voice.VoiceInteractionSession {
            public MavisVoiceSession(android.content.Context context) { super(context); }
            @Override
            public void onShow(android.os.Bundle args, int flags) {
              super.onShow(args, flags);
              android.widget.LinearLayout root = new android.widget.LinearLayout(getContext());
              root.setOrientation(android.widget.LinearLayout.VERTICAL);
              root.setGravity(android.view.Gravity.CENTER);
              root.setPadding(32, 48, 32, 32);
              root.setBackgroundColor(0xff050914);
              android.widget.TextView logo = new android.widget.TextView(getContext());
              logo.setText("M");
              logo.setTextColor(android.graphics.Color.WHITE);
              logo.setTextSize(42);
              logo.setTypeface(null, android.graphics.Typeface.BOLD);
              logo.setGravity(android.view.Gravity.CENTER);
              android.graphics.drawable.GradientDrawable circle = new android.graphics.drawable.GradientDrawable(
                android.graphics.drawable.GradientDrawable.Orientation.TL_BR,
                new int[]{0xff65c9ff, 0xff0751d4});
              circle.setShape(android.graphics.drawable.GradientDrawable.OVAL);
              circle.setStroke(3, 0xffd9f5ff);
              logo.setBackground(circle);
              android.widget.LinearLayout.LayoutParams lp = new android.widget.LinearLayout.LayoutParams(112,112);
              lp.bottomMargin = 24;
              root.addView(logo, lp);
              android.widget.TextView title = new android.widget.TextView(getContext());
              title.setText("MAVIS AI");
              title.setTextColor(0xffeaf5ff);
              title.setTextSize(26);
              title.setTypeface(null, android.graphics.Typeface.BOLD);
              title.setGravity(android.view.Gravity.CENTER);
              root.addView(title);
              android.widget.TextView prompt = new android.widget.TextView(getContext());
              prompt.setText("Start talking");
              prompt.setTextColor(0xff9eb8d5);
              prompt.setTextSize(20);
              prompt.setGravity(android.view.Gravity.CENTER);
              android.widget.LinearLayout.LayoutParams pp = new android.widget.LinearLayout.LayoutParams(-1,-2);
              pp.topMargin = 70;
              pp.bottomMargin = 24;
              root.addView(prompt, pp);
              android.widget.Button open = new android.widget.Button(getContext());
              open.setText("Open Mavis");
              open.setOnClickListener(v -> {
                android.content.Intent intent = getContext().getPackageManager().getLaunchIntentForPackage(getContext().getPackageName());
                if (intent != null) {
                  intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK | android.content.Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  getContext().startActivity(intent);
                }
                hide();
              });
              root.addView(open, new android.widget.LinearLayout.LayoutParams(-1,-2));
              setContentView(root);
            }
          }
          '''.replace('PACKAGE_NAME', package))
          res = root / 'res' / 'xml'
          res.mkdir(parents=True, exist_ok=True)
          (res / 'mavis_voice_interaction.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <voice-interaction-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:sessionService="PACKAGE_NAME.MavisVoiceSessionService"
              android:supportsAssist="true"
              android:supportsLaunchVoiceAssistFromKeyguard="false" />
          '''.replace('PACKAGE_NAME', package))
          if 'MavisVoiceInteractionService' not in s:
              block = '''
                  <service
                      android:name=".MavisVoiceInteractionService"
                      android:label="Mavis"
                      android:permission="android.permission.BIND_VOICE_INTERACTION"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.voice.VoiceInteractionService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.voice"
                          android:resource="@xml/mavis_voice_interaction" />
                  </service>
                  <service
                      android:name=".MavisVoiceSessionService"
                      android:permission="android.permission.BIND_VOICE_INTERACTION"
                      android:exported="true" />
              '''
              s = s.replace('</application>', block + '\\n    </application>')
          manifest.write_text(s)
          print('Registered Mavis as a selectable Android voice-assistant service.')
          PY

      - name: Enable core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/mavis/android/app')
          candidates = [root / 'build.gradle.kts', root / 'build.gradle']
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Could not find app-level Gradle build file')
          s = gradle.read_text()

          if gradle.name.endswith('.kts'):
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  pattern = r'compileOptions\s*\{'
                  match = re.search(pattern, s)
                  if not match:
                      raise SystemExit('Could not find compileOptions block in build.gradle.kts')
                  start = match.end()
                  s = s[:start] + '\n        isCoreLibraryDesugaringEnabled = true' + s[start:]
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          else:
              if 'coreLibraryDesugaringEnabled' not in s:
                  pattern = r'compileOptions\s*\{'
                  match = re.search(pattern, s)
                  if not match:
                      raise SystemExit('Could not find compileOptions block in build.gradle')
                  start = match.end()
                  s = s[:start] + '\n        coreLibraryDesugaringEnabled true' + s[start:]
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"

          if 'desugar_jdk_libs' not in s:
              match = re.search(r'dependencies\s*\{', s)
              if match:
                  start = match.end()
                  s = s[:start] + '\n    ' + dep + s[start:]
              else:
                  # Recent Flutter templates may omit an app-level dependencies block.
                  # Create one rather than failing the workflow.
                  if gradle.name.endswith('.kts'):
                      s = s.rstrip() + '\n\ndependencies {\n    ' + dep + '\n}\n'
                  else:
                      s = s.rstrip() + '\n\ndependencies {\n    ' + dep + '\n}\n'
          gradle.write_text(s)
          print(f'Enabled core library desugaring in {gradle}')
          PY

      - name: Resolve dependencies
        working-directory: /tmp/mavis
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: /tmp/mavis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        working-directory: /tmp/mavis
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mavis-debug-apk
          path: /tmp/mavis/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
